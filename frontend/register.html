<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Meridian General Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="brand" href="index.html"><span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" fill="#fff"/></svg></span><span>Meridian<small>General Hospital</small></span></a>
    <img data-img="patientCare" alt="">
    <div><h2>Your records, your appointments, one account.</h2><p>Register once to book visits with our specialists and keep your prescriptions within reach.</p></div>
  </aside>
  <main class="auth-main">
    <div class="auth-card" style="width:min(560px,100%)">
      <h1>Create your patient account</h1>
      <p class="muted" style="margin-bottom:22px">Already registered? <a href="login.html">Log in</a></p>
      <form id="regForm" novalidate>
        <div class="form-grid">
          <div class="field full"><label for="name">Full name</label><input class="input" id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="phone">Phone number</label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98200 00000" required></div>
          <div class="field"><label for="gender">Gender</label><select class="input" id="gender" name="gender" required><option value="">Select</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></div>
          <div class="field"><label for="dateOfBirth">Date of birth</label><input class="input" id="dateOfBirth" name="dateOfBirth" type="date" autocomplete="bday" required></div>
          <div class="field full"><label for="address">Address</label><textarea class="input" id="address" name="address" rows="2" autocomplete="street-address" required></textarea></div>
          <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required><div class="hint">At least 8 characters with a letter and a number.</div></div>
          <div class="field"><label for="confirmPassword">Confirm password</label><input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>
    </div>
  </main>
</div>
<script src="js/config.js"></script><script src="js/images.js"></script><script src="js/ui.js"></script><script src="js/api.js"></script><script src="js/public.js"></script>
<script src="js/pages/register.js"></script></body></html>
